name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build, Type Check, and Database Verification (CI)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript Compile & Type Check
        run: npm run build

      - name: 🗄️ Run Database Migrations
        env:
          MONGODB_URI: mongodb://localhost:27017/doctor_tracker_ci
          JWT_SECRET: ci_test_super_secure_jwt_secret_key_2026
          ADMIN_NAME: CI Admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: Admin@123
        run: npm run migrate

      - name: 🌱 Run Database Seeder
        env:
          MONGODB_URI: mongodb://localhost:27017/doctor_tracker_ci
          JWT_SECRET: ci_test_super_secure_jwt_secret_key_2026
          ADMIN_NAME: CI Admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: Admin@123
        run: npm run seed

      - name: 🚀 Start Server in Background for API Verification
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/doctor_tracker_ci
          JWT_SECRET: ci_test_super_secure_jwt_secret_key_2026
          CORS_ORIGIN: http://localhost:3000
          ADMIN_NAME: CI Admin
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: Admin@123
        run: |
          node dist/server.js &
          sleep 5

      - name: 🧪 Verify Health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:5000/health

      - name: 🧪 Run Bruno API Test Collection
        run: |
          npx @usebruno/cli run bruno/environments/Local.bru bruno/Health/
        continue-on-error: true

  # -------------------------------------------------------------
  # Job 2: Deployment Stage (CD)
  # Triggers automatically on push to main/master after CI passes
  # -------------------------------------------------------------
  deploy:
    name: Continuous Deployment
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Notification / Webhook
        run: |
          echo "CI pipeline successfully passed. Ready to trigger production deployment."
          # If using Render, Railway, or Webhook deploy:
          # curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

